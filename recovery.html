<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b5d"><title>استعادة بيانات حسابات برج مكة</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#f4f7fa;color:#183044;margin:0;padding:18px}.card{background:#fff;border-radius:18px;padding:16px;margin:0 auto 12px;max-width:820px;box-shadow:0 2px 12px #173b5d12}h1{font-size:22px;margin:0 0 8px}.notice{padding:12px;border-radius:12px;background:#fff8df;line-height:1.7}.ok{padding:12px;border-radius:12px;background:#e9f8ef;color:#176d3e}.danger{padding:12px;border-radius:12px;background:#fff0f0;color:#9f2f2f}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}button{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;background:#123b5d;color:#fff}.secondary{background:#e9f2f8;color:#276a98}.small{font-size:12px;color:#71818d;line-height:1.7}.candidate{border:1px solid #e5edf2;border-radius:14px;padding:12px;margin-top:9px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#edf3f7;font-size:12px}.mono{direction:ltr;text-align:left;word-break:break-all;background:#f7f9fa;padding:8px;border-radius:8px;font-size:12px}.warn{color:#9f2f2f;font-weight:800}</style></head><body>
<div class="card"><h1>🔎 فحص واستعادة بيانات حسابات برج مكة</h1><div class="notice">هذه النسخة <b>لا تحذف ولا تستبدل أي بيانات أثناء الفحص</b>. تفحص التخزين المحلي وIndexedDB على نفس نطاق الموقع، وتعرض المفاتيح وقواعد البيانات الموجودة حتى لو لم تكن بنيتها معروفة.</div></div>
<div class="card"><div class="row"><button onclick="scanAll()">🔎 فحص كل البيانات</button><button class="secondary" onclick="backupAll()">💾 حفظ نسخة خام من التخزين</button></div><div id="result" style="margin-top:12px"></div></div>
<script>
const KEY='hasabat_borg_makka_v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar=n=>Number(n||0).toLocaleString('ar-EG');
function analyze(key,raw){let o={key,size:raw.length,score:0,residents:0,tx:0,opening:0,gate:0};try{let p=JSON.parse(raw),d=p?.data&&typeof p.data==='object'?p.data:p;if(d&&typeof d==='object'){if(Array.isArray(d.residents)){o.residents=d.residents.length;o.score+=5}if(Array.isArray(d.tx)){o.tx=d.tx.length;o.score+=5}if(d.opening&&typeof d.opening==='object'){o.opening=Object.keys(d.opening).length;o.score+=3}if(d.gate&&Array.isArray(d.gate.ops)){o.gate=d.gate.ops.length;o.score+=2}if(d.categories&&typeof d.categories==='object')o.score++;if(p?.app==='حسابات برج مكة')o.score+=5}}catch(e){}return o}
function localRows(){let all=[],hits=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k)continue;let raw=localStorage.getItem(k)||'',o=analyze(k,raw);all.push({key:k,size:raw.length,known:o.score>0||k===KEY});if(o.score>0||k===KEY)hits.push(o)}return {all,hits}}
function openDb(name){return new Promise((resolve,reject)=>{let req=indexedDB.open(name);req.onsuccess=()=>{let db=req.result,stores=[...db.objectStoreNames],out=[];if(!stores.length){db.close();return resolve({name,stores:[]})}let pending=stores.length;stores.forEach(s=>{let tx=db.transaction(s,'readonly'),st=tx.objectStore(s),arr=[],cur=st.openCursor();cur.onsuccess=e=>{let c=e.target.result;if(c){arr.push({key:c.key,value:c.value});c.continue()}else{out.push({name:s,count:arr.length,records:arr.slice(0,200)});if(--pending===0){db.close();resolve({name,stores:out})}}};cur.onerror=()=>{out.push({name:s,count:-1,records:[]});if(--pending===0){db.close();resolve({name,stores:out})}}})};req.onerror=()=>reject(req.error)})}
async function scanIDB(){if(!window.indexedDB)return [];if(!indexedDB.databases)return [{name:'(لا يمكن سرد قواعد IndexedDB تلقائيًا في هذا المتصفح)',stores:[]}];let list=await indexedDB.databases(),out=[];for(const x of list){if(!x.name)continue;try{out.push(await openDb(x.name))}catch(e){out.push({name:x.name,error:String(e),stores:[]})}}return out}
function renderLocal(d){let h='<h2>التخزين المحلي (localStorage)</h2>';if(!d.all.length)h+='<div class="danger">لا توجد مفاتيح localStorage في هذا النطاق.</div>';else{h+='<div class="small">إجمالي المفاتيح: '+ar(d.all.length)+'</div>';h+=d.all.map(x=>'<div class="candidate"><b>المفتاح:</b><div class="mono">'+esc(x.key)+'</div><div class="small">الحجم: '+ar(x.size)+' بايت '+(x.known?'— <b>مرشح محاسبي</b>':'')+'</div>'+(x.known?'<button class="secondary" style="margin-top:7px" onclick="downloadKey('+JSON.stringify(x.key)+')">حفظ نسخة هذا المفتاح</button>':'')+'</div>').join('')}return h}
function renderIDB(dbs){let h='<h2>قواعد IndexedDB</h2>';if(!dbs.length)return h+'<div class="danger">لم يتم العثور على قواعد IndexedDB في هذا النطاق.</div>';for(const db of dbs){h+='<div class="candidate"><b>قاعدة البيانات:</b> '+esc(db.name);if(db.error){h+='<div class="danger">تعذر قراءتها: '+esc(db.error)+'</div></div>';continue}if(!db.stores.length){h+='<div class="small">لا توجد مخازن.</div></div>';continue}for(const s of db.stores){h+='<div style="margin-top:8px"><b>المخزن:</b> '+esc(s.name)+' — <span class="small">'+(s.count<0?'تعذر العد':ar(s.count)+' سجل')+'</span>';if(s.count>0){let sample=JSON.stringify(s.records.slice(0,3));h+='<div class="small">عينة أول 3 سجلات: <span class="mono">'+esc(sample)+'</span></div>'}h+='</div>'}h+='</div>'}return h}
async function scanAll(){let r=document.getElementById('result');r.innerHTML='<div class="notice">جارٍ فحص localStorage وIndexedDB… لا تغلق الصفحة.</div>';let local=localRows(),dbs=await scanIDB();let found=local.hits.length||dbs.some(d=>d.stores?.some(s=>s.count>0));r.innerHTML=(found?'<div class="ok">تم العثور على بيانات/قواعد تخزين في هذا النطاق. <span class="warn">لم يتم تعديل أي شيء.</span></div>':'<div class="danger">لم نجد بنية محاسبية معروفة حتى الآن في هذا النطاق. لم يتم تعديل أي شيء.</div>')+renderLocal(local)+renderIDB(dbs)}
function downloadKey(key){let raw=localStorage.getItem(key);if(raw===null)return alert('المفتاح غير موجود.');download('برج-مكة-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'حسابات برج مكة — نسخة خام',key,exportedAt:new Date().toISOString(),raw},null,2))}
function backupAll(){let storage={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k)storage[k]=localStorage.getItem(k)}download('برج-مكة-كل-localStorage-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'حسابات برج مكة — كل التخزين',exportedAt:new Date().toISOString(),storage},null,2))}
function download(name,text){let b=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
scanAll();
</script></body></html>
