<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b5d"><title>استعادة بيانات حسابات برج مكة</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#f4f7fa;color:#183044;margin:0;padding:18px}.card{background:#fff;border-radius:18px;padding:16px;margin:0 auto 12px;max-width:720px;box-shadow:0 2px 12px #173b5d12}h1{font-size:22px;margin:0 0 8px}.notice{padding:12px;border-radius:12px;background:#fff8df;line-height:1.7}.ok{padding:12px;border-radius:12px;background:#e9f8ef;color:#176d3e}.danger{padding:12px;border-radius:12px;background:#fff0f0;color:#9f2f2f}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}button{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;background:#123b5d;color:#fff}.secondary{background:#e9f2f8;color:#276a98}.dangerbtn{background:#fff0f0;color:#b12f2f}.small{font-size:12px;color:#71818d;line-height:1.7}.candidate{border:1px solid #e5edf2;border-radius:14px;padding:12px;margin-top:9px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#edf3f7;font-size:12px}.mono{direction:ltr;text-align:left;word-break:break-all;background:#f7f9fa;padding:8px;border-radius:8px;font-size:12px}</style></head><body><div class="card"><h1>🔎 استعادة بيانات حسابات برج مكة</h1><div class="notice">هذه الصفحة تعمل على نفس عنوان الموقع، ولذلك تستطيع قراءة <b>التخزين المحلي الموجود على الهاتف</b>. لا يتم حذف أو تعديل أي مفتاح أثناء الفحص. إذا وُجدت بيانات قديمة، احفظها أولًا قبل الاستعادة.</div></div><div class="card"><div class="row"><button onclick="scan()">فحص البيانات الآن</button><button class="secondary" onclick="backupAll()">حفظ نسخة خام من كل التخزين</button></div><div id="result" style="margin-top:12px"></div></div><script>
const KEY='hasabat_borg_makka_v1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar=n=>Number(n||0).toLocaleString('ar-EG');
function analyze(key,raw){let o={key,size:raw.length,score:0,data:null,residents:0,tx:0,opening:0,gate:0};try{o.data=JSON.parse(raw);let d=o.data?.data&&typeof o.data.data==='object'?o.data.data:o.data;if(d&&typeof d==='object'){if(Array.isArray(d.residents)){o.residents=d.residents.length;o.score+=5}if(Array.isArray(d.tx)){o.tx=d.tx.length;o.score+=5}if(d.opening&&typeof d.opening==='object'){o.opening=Object.keys(d.opening).length;o.score+=3}if(d.gate&&Array.isArray(d.gate.ops)){o.gate=d.gate.ops.length;o.score+=2}if(d.categories&&typeof d.categories==='object')o.score++;if(o.data?.app==='حسابات برج مكة')o.score+=5}}catch(e){o.error=true}return o}
function scan(){let hits=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k)continue;let raw=localStorage.getItem(k)||'';let o=analyze(k,raw);if(o.score>0||k===KEY)hits.push(o)}hits.sort((a,b)=>b.score-a.score||b.size-a.size);let r=document.getElementById('result');if(!hits.length){r.innerHTML='<div class="danger">لم أجد أي مفتاح يحتوي على بنية بيانات محاسبية معروفة في هذا النطاق. لم يتم تعديل أي بيانات.</div>';return}r.innerHTML='<div class="ok">تم العثور على '+ar(hits.length)+' مرشح. لم يتم تعديل أي بيانات.</div>'+hits.map((h,i)=>{let same=h.key===KEY;return '<div class="candidate"><b>المفتاح:</b><div class="mono">'+esc(h.key)+'</div><div class="small">الحجم: '+ar(h.size)+' بايت — السكان: '+ar(h.residents)+' — العمليات: '+ar(h.tx)+' — أرصدة افتتاحية: '+ar(h.opening)+' — حركات البواب: '+ar(h.gate)+'</div><div class="row" style="margin-top:8px">'+(same?'<span class="badge">المفتاح الحالي</span>':(h.score>=5?'<button onclick="recover('+JSON.stringify(h.key)+')">استعادة هذه البيانات</button>':''))+'<button class="secondary" onclick="downloadKey('+JSON.stringify(h.key)+')">حفظ نسخة هذا المفتاح</button></div></div>'}).join('')}
function downloadKey(key){let raw=localStorage.getItem(key);if(raw===null){alert('المفتاح غير موجود الآن.');return}let p={app:'حسابات برج مكة — نسخة خام',key,exportedAt:new Date().toISOString(),raw};download('استعادة-برج-مكة-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(p,null,2))}
function backupAll(){let storage={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k)storage[k]=localStorage.getItem(k)}download('برج-مكة-تخزين-خام-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'حسابات برج مكة — كل التخزين',exportedAt:new Date().toISOString(),storage},null,2))}
function download(name,text){let b=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function recover(key){let raw=localStorage.getItem(key);if(raw===null)return alert('البيانات غير موجودة.');let parsed;try{parsed=JSON.parse(raw)}catch(e){return alert('المفتاح ليس JSON صالحًا.')}let incoming=parsed?.data&&typeof parsed.data==='object'?parsed.data:parsed;if(!incoming||typeof incoming!=='object')return alert('بيانات غير صالحة.');let current=localStorage.getItem(KEY)||'';let backupKey=KEY+'__before_recovery_'+Date.now();try{localStorage.setItem(backupKey,current)}catch(e){return alert('تعذر حفظ نسخة الأمان. استخدم حفظ نسخة هذا المفتاح أولًا.')}if(!confirm('سيتم استبدال البيانات الحالية ببيانات المفتاح المحدد، مع الاحتفاظ بنسخة أمان للمحتوى الحالي. هل تريد المتابعة؟')){localStorage.removeItem(backupKey);return}try{localStorage.setItem(KEY,JSON.stringify(incoming));alert('تمت الاستعادة. افتح التطبيق من جديد. نسخة الأمان محفوظة تحت مفتاح داخلي.')}catch(e){alert('فشلت الاستعادة. لم يتم حذف البيانات الأصلية.')}}
scan();</script></body></html>
